<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview - Group 8 Dashboard</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* CSS viết theo từng dòng nhỏ đúng chuẩn giáo trình */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e5e5e5;
            font-family: 'Poppins', sans-serif;
            color: #141522;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 1440px;
            height: 944px;
            background-color: #F3F4F8;
            border-radius: 20px;
            position: relative;
            display: flex;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 250px;
            background-color: #FFFFFF;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            display: flex;
            align-items: center;
            margin-bottom: 60px;
        }

        .nav-item {
            text-decoration: none;
            color: #141522;
            display: flex;
            align-items: center;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 10px;
            font-weight: 600;
            opacity: 0.6;
        }

        .nav-item.active {
            background-color: #F5F5F7;
            opacity: 1;
        }

        .nav-item i {
            margin-right: 15px;
            font-size: 20px;
        }

        /* MAIN CONTENT */
        .main-wrapper {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header {
            height: 80px;
            background-color: #FFFFFF;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            margin-bottom: 40px;
        }

        .search-bar {
            background-color: #F5F5F7;
            width: 300px;
            height: 45px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .search-bar input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            margin-left: 10px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            position: relative;
        }

        .user-profile {
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-left: 30px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            background-color: #e0e0e0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 10px;
        }

        /* DROPDOWNS */
        .dropdown {
            position: absolute;
            background-color: #FFFFFF;
            border: 1px solid #ddd;
            border-radius: 15px;
            display: none;
            z-index: 100;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .profile-drop {
            top: 60px;
            right: 0;
            width: 200px;
        }

        .drop-item {
            padding: 10px;
            cursor: pointer;
            font-weight: 500;
        }

        /* OVERVIEW CONTENT */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: #FFFFFF;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
        }

        .stat-num {
            font-size: 32px;
            font-weight: 700;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .card {
            background-color: #FFFFFF;
            border-radius: 20px;
            padding: 25px;
        }

        /* Fix lỗi ảnh biểu đồ */
        .chart-img {
            width: 100%;
            height: auto;
            display: block;
            margin-top: 15px;
        }

        /* DEADLINE LIST */
        .deadline-list {
            list-style: none;
        }

        .dl-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .dl-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dl-item.done strong {
            text-decoration: line-through;
            color: #888;
        }

        .dl-item.done .dl-check {
            background-color: #05cd99;
            border-color: #05cd99;
            color: white;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-list-check" style="font-size: 24px;"></i>
                <span style="font-size: 24px; font-weight: 700; margin-left: 10px;">Group 8</span>
            </div>
            <div class="nav-menu">
                <a href="overview.html" class="nav-item active"><i class="fa-solid fa-border-all"></i> Overview</a>
                <a href="task.html" class="nav-item"><i class="fa-regular fa-file-lines"></i> Task</a>
                <a href="#" class="nav-item"><i class="fa-regular fa-calendar"></i> Calendar</a>
            </div>
        </div>

        <div class="main-wrapper">
            <div class="header">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search projects...">
                </div>
                <div class="header-actions">
                    <div class="noti-btn" id="btn-noti"><i class="fa-regular fa-bell"></i></div>
                    
                    <div class="user-profile" id="btn-profile">
                        <span>Hello, User!</span>
                        <div class="avatar"><i class="fa-regular fa-user"></i></div>
                    </div>

                    <div class="dropdown profile-drop" id="drop-profile">
                        <div class="drop-item">Profile Settings</div>
                        <div class="drop-item">Account</div>
                        <hr>
                        <div class="drop-item">Log out</div>
                    </div>
                </div>
            </div>

            <div class="page-content">
                <div class="stats-row">
                    <div class="stat-card">
                        <p>Total Projects</p>
                        <h1 class="stat-num">100</h1>
                    </div>
                    <div class="stat-card">
                        <p>Overdue</p>
                        <h1 class="stat-num">100</h1>
                    </div>
                    <div class="stat-card">
                        <p>Completed</p>
                        <h1 class="stat-num">100</h1>
                    </div>
                    <div class="stat-card">
                        <p>Incomplete</p>
                        <h1 class="stat-num">100</h1>
                    </div>
                </div>

                <div class="main-grid">
                    <div class="card">
                        <h3>Monthly Projects Completed</h3>
                        <img src="chart-image.png" class="chart-img" alt="Chart Statistics">
                    </div>
                    <div class="card">
                        <h3>Upcoming Deadlines</h3>
                        <div class="deadline-list">
                            <div class="dl-item" onclick="v_toggle(this)">
                                <div><strong>Deadline #1</strong><p>18/04/2026</p></div>
                                <div class="dl-check"><i class="fa-solid fa-check" style="opacity:0"></i></div>
                            </div>
                            <div class="dl-item done" onclick="v_toggle(this)">
                                <div><strong>Deadline #2</strong><p>15/04/2026</p></div>
                                <div class="dl-check"><i class="fa-solid fa-check"></i></div>
                            </div>
                            </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
