<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Group 8</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* CSS tương tự trang login */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .signup-card { background-color: #ffffff; padding: 40px; border-radius: 8px; width: 400px; border: 1px solid #ddd; }
        h1 { font-size: 28px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
        input { width: 100%; height: 35px; padding: 0 10px; border: 1px solid #a6a6a6; border-radius: 3px; }
        .btn-primary { width: 100%; height: 35px; background-color: #111; color: white; border-radius: 3px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="signup-card">
        <h1>Create account</h1>
        <form onsubmit="return v_signup(event)">
            <div class="input-group">
                <label>Your name</label>
                <input type="text" required>
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="At least 6 characters" required>
            </div>
            <button type="submit" class="btn-primary">Create Account</button>
        </form>
        <p style="font-size: 13px; margin-top: 20px;">Already have an account? <a href="index.html">Sign in</a></p>
    </div>
    <script>
        function v_signup(e) {
            e.preventDefault();
            alert("Account created successfully!");
            window.location.href = "index.html";
            return false;
        }
    </script>
</body>
</html>
