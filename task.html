<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Group 8 Dashboard</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* CSS viết rời từng dòng */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #e5e5e5;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .app-container {
            width: 1440px;
            height: 944px;
            background-color: #F3F4F8;
            border-radius: 20px;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Copy từ trang Overview */
        .sidebar {
            width: 250px;
            background-color: #FFFFFF;
            padding: 40px 20px;
        }

        .nav-item {
            text-decoration: none;
            color: #333;
            display: flex;
            align-items: center;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 10px;
            font-weight: 600;
            opacity: 0.6;
        }

        .nav-item.active {
            background-color: #F5F5F7;
            opacity: 1;
        }

        .nav-item i { margin-right: 15px; }

        /* Task Content */
        .main-wrapper {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .task-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 20px;
        }

        .task-card {
            background-color: #FFFFFF;
            border-radius: 20px;
            padding: 20px;
        }

        .task-img {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #eee;
            border-radius: 5px;
            margin: 10px 0;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background-color: #546FFF;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="logo" style="margin-bottom: 50px;">
                <i class="fa-solid fa-list-check"></i> <strong>Group 8</strong>
            </div>
            <div class="nav-menu">
                <a href="overview.html" class="nav-item"><i class="fa-solid fa-border-all"></i> Overview</a>
                <a href="task.html" class="nav-item active"><i class="fa-regular fa-file-lines"></i> Task</a>
                <a href="#" class="nav-item"><i class="fa-regular fa-calendar"></i> Calendar</a>
            </div>
        </div>

        <div class="main-wrapper">
            <h2>Personal Projects</h2>
            <div class="task-grid">
                <div class="task-card">
                    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=400" class="task-img">
                    <h4>Web Design UI</h4>
                    <p style="font-size: 12px; color: #888;">Deadline: 2 days left</p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 80%;"></div>
                    </div>
                    <p style="font-size: 12px; text-align: right;">80%</p>
                </div>
                </div>
        </div>
    </div>

</body>
</html>
