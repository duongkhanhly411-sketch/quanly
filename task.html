<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Group 8 Dashboard</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e5e5e5;
            font-family: 'Poppins', sans-serif;
            color: #141522;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 1440px;
            height: 944px;
            background-color: #F3F4F8;
            border-radius: 20px;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 250px;
            background-color: #FFFFFF;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            border-radius: 20px 0 0 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            margin-bottom: 60px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            color: #141522;
            opacity: 0.6;
        }

        .nav-item.active {
            background-color: #F5F5F7;
            opacity: 1;
        }

        /* MAIN CONTENT */
        .main-wrapper {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .task-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-top: 20px;
        }

        .t-card {
            background-color: #FFFFFF;
            border-radius: 20px;
            padding: 20px;
        }

        .t-img {
            width: 100%;
            height: 180px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .prog-track {
            width: 100%;
            height: 10px;
            background-color: #eee;
            border-radius: 10px;
            margin: 10px 0;
        }

        .prog-fill {
            height: 100%;
            background-color: #546FFF;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-list-check" style="font-size: 32px;"></i>
                <strong style="font-size: 32px; margin-left: 15px;">Group 8</strong>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-border-all"></i> Overview</a>
                <a href="task.html" class="nav-item active"><i class="fa-regular fa-file-lines"></i> Task</a>
                <a href="#" class="nav-item"><i class="fa-regular fa-calendar"></i> Calendar</a>
            </div>
        </div>

        <div class="main-wrapper">
            <h2>Your Current Projects</h2>
            <div class="task-grid">
                <div class="t-card">
                    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=400" class="t-img">
                    <h4>Web UI Design</h4>
                    <p>UX Designer</p>
                    <div class="prog-track"><div class="prog-fill" style="width: 85%;"></div></div>
                    <p>85% Completed</p>
                </div>
                <div class="t-card">
                    <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=400" class="t-img">
                    <h4>Bug Fixing</h4>
                    <p>Developer</p>
                    <div class="prog-track"><div class="prog-fill" style="width: 40%;"></div></div>
                    <p>40% Completed</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
