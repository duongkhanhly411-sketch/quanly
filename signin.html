<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Group 7</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            width: 400px;
            border: 1px solid #ddd;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 15px;
            position: relative;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            height: 35px;
            padding: 0 10px;
            border: 1px solid #a6a6a6;
            border-radius: 3px;
            outline: none;
        }

        input:focus {
            border-color: #e77600;
            box-shadow: 0 0 3px 2px rgba(228,121,17,0.5);
        }

        /* Nút Show/Hide Password */
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 25px;
            background: none;
            border: none;
            color: #0066c0;
            font-size: 13px;
            cursor: pointer;
            padding: 5px;
        }
        
        .toggle-password:hover {
            text-decoration: underline;
            color: #c45500;
        }

        .btn-primary {
            width: 100%;
            height: 35px;
            background-color: #111;
            color: white;
            border: 1px solid #000;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: #333;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider span {
            background: #f3f4f8;
            padding: 0 10px;
            font-size: 12px;
            color: #767676;
        }

        .btn-secondary {
            width: 100%;
            height: 35px;
            background: #e7e9ec;
            border: 1px solid #adb1b8;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    
    <div class="login-card">
        <h1>Sign in</h1>
        <form id="loginForm" onsubmit="return v_login(event)">
            
            <div class="input-group">
                <label>Email or phone number</label>
                <input type="text" id="email" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
                <button type="button" class="toggle-password" id="btnToggle" onclick="v_toggle_pass()">Show</button>
            </div>
            
            <button type="submit" class="btn-primary">Continue</button>
        </form>

        <p style="font-size: 12px; margin-top: 15px;">By continuing, you agree to Group 7's Conditions of Use.</p>
        
        <div class="divider">
            <span>New to our community?</span>
        </div>
        
        <button class="btn-secondary" onclick="window.location.href='signup.html'">Create your account</button>
    </div>

    <script>
        // Hàm đăng nhập (giữ nguyên của bạn)
        function v_login(e) {
            e.preventDefault();
            // Code giả lập đăng nhập thành công nhảy vào Dashboard
            window.location.href = "overview.html";
            return false;
        }

        // Thêm hàm ẩn/hiện mật khẩu viết theo chuẩn giáo trình
        function v_toggle_pass() {
            var o_mat_khau = document.getElementById("password");
            var nut_bam = document.getElementById("btnToggle");

            if (o_mat_khau.type === "password") {
                o_mat_khau.type = "text";
                nut_bam.innerHTML = "Hide";
            } else {
                o_mat_khau.type = "password";
                nut_bam.innerHTML = "Show";
            }
        }
    </script>
</body>
</html>
