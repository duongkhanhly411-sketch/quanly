<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Group 7</title>
    <link rel="icon" type="image/x-icon" href="taskicon.png">
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        body { 
            background-color: #f3f4f6;
            font-family: Arial, sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center; 
        }
        .container { 
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 20px;
            transform-origin: center center;
        }
        
        @media (min-width: 1400px) { .container { transform: scale(1.2); } }
        @media (min-width: 2000px) { .container { transform: scale(1.5); } }
        
        .logo-placeholder { 
            width: 50px;
            height: 50px;
            background-color: #ccc;
            border-radius: 50%;
            margin: 0 auto 20px; 
        }
        .btn-primary { 
            width: 100%;
            padding: 12px;
            background-color: #bcbcbc;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .terms { 
            font-size: 12px;
            color: #666;
            margin: 20px 0;
            text-align: center;
        }
        .terms a {
            color: #333;
            text-decoration: underline;
        }
        footer { 
            margin-top: 40px;
            font-size: 12px;
        }
        footer a { 
            text-decoration: underline;
            color: #333;
            margin: 0 10px;
        }
        
        .hero-container { max-width: 800px; }
        .hero-section h1 { 
            font-size: 42px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
            color: #1a1a1a;
        }
        .hero-subtitle { 
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .cta-group { 
            max-width: 320px;
            margin: 0 auto; 
        }
    </style>
</head>
<body>
    <div class="container hero-container">
        <div class="logo-placeholder"></div>
        
        <header class="hero-section">
            <h1>Take control of your day.</h1>
            <p class="hero-subtitle">The simple, minimalist way to organize your personal tasks, track your goals, and clear your mind.</p>
        </header>

        <div class="cta-group">
            <button class="btn-primary" onclick="location.href='signup.html'">Start your first list</button>
            <p class="terms">Already have an account? <a href="signin.html">Sign in</a></p>
        </div>

        <footer>
            <a href="#">Help Center</a>
            <a href="#">Terms of Service</a>
            <a href="#">Privacy Policy</a>
        </footer>
    </div>
</body>
</html>
